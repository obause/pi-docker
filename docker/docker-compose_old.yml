version: "3.7"

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    ports:
      - '80:80'
    environment:
      DEFAULT_HOST: pihole.bause.local
    volumes:
      - '/var/run/docker.sock:/tmp/docker.sock'
    restart: always
    networks:
      - app-nw

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      #- "67:67/udp" # DHCP Server Usage
      - "${HTTPPORT}:80/tcp"
      #- "${HTTPSPORT}:443/tcp"
    environment:
      TZ: ${TZ}
      WEBPASSWORD: ${WEBPASSWORD}
      #DNS1: ${DNSSERVER1}
      #DNS2: ${DNSSERVER2}
      FTLCONF_LOCAL_IPV4: 192.168.178.5
      PROXY_LOCATION: pihole
      VIRTUAL_HOST: pihole.bause.local
      VIRTUAL_PORT: 80
      #CONDITIONAL_FORWARDING: ${CONDITIONAL_FORWARDING}
      #CONDITIONAL_FORWARDING_IP: ${CONDITIONAL_FORWARDING_IP}
      #CONDITIONAL_FORWARDING_DOMAIN: ${CONDITIONAL_FORWARDING_DOMAIN}
      #CONDITIONAL_FORWARDING_REVERSE: ${CONDITIONAL_FORWARDING_REVERSE}
    # Volumes store your data between container upgrades
    volumes:
      - ./pihole/conf/:/etc/pihole/
      - ./pihole/dnsmasq.d/conf/:/etc/dnsmasq.d/
      # run `touch ./var-log/pihole.log` first unless you like errors
      - './var-log/pihole.log:/var/log/pihole.log'
    labels:
        com.centurylinklabs.watchtower.enable: "true"
    # Recommended but not required (DHCP needs NET_ADMIN)
    #   https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    #cap_add:
    #  - NET_ADMIN
    networks:
      - app-nw
  wg-easy:
    container_name: wg-easy
    image: ghcr.io/wg-easy/wg-easy
    environment:
      - PASSWORD=test
      - WG_HOST=217.252.201.193
    volumes:
      - ./wireguard:/etc/wireguard
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - app-nw

  cloudflare-ddns:
    container_name: dyndns
    image: favonia/cloudflare-ddns:latest
    network_mode: host # This bypasses network isolation and makes IPv6 easier
    restart: always
    user: "1000:1000"
    read_only: true
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
      - DOMAINS=${DOMAINS}
      - PROXIED=${PROXIED}
      - UPDATE_CRON=${UPDATE_CRON}

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD=${PASSWORD} 
      #- HASHED_PASSWORD= 
      - SUDO_PASSWORD=${SUDO_PASSWORD} 
      #- SUDO_PASSWORD_HASH= 
      #- PROXY_DOMAIN=code-server.my.domain 
      - DEFAULT_WORKSPACE=${DEFAULT_WORKSPACE} 
    volumes:
      - ./code-server:/config
    ports:
      - 8443:8443
    restart: unless-stopped

networks:
  app-nw:
    internal: false
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-pihole
