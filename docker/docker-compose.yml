
networks:
  proxy:
    driver: bridge
    name: proxy
  app-nw:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-pihole
  iot:
    driver: bridge

volumes:
  portainer_data:
  mosquitto_data: 

services:
  # -- Sicherer Socket-Proxy (Least Privilege) --
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      VOLUMES: 1
      # Alle anderen Variablen default 0 => kein Zugriff
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [proxy]

  # -- Traefik Reverse Proxy --
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: always
    depends_on:
      socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: []
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/dynamic:/dynamic:ro
      - ./traefik/certs:/certs:ro
      - /etc/pi-docker/secrets/traefik:/run/secrets/traefik:ro
      # ACME-Ordner nur falls du irgendwann Let's Encrypt nutzt:
      - /srv/pi-docker/traefik/acme:/acme
    networks: [proxy]
    labels:
      traefik.enable: "true"
      # Dashboard intern absichern: nur lokal per Hostname
      traefik.http.routers.traefik.rule: Host(`traefik.bause.lan`)
      traefik.http.routers.traefik.entrypoints: websecure
      traefik.http.routers.traefik.tls: "true"
      traefik.http.routers.traefik.service: api@internal

  # -- Portainer (HTTP hinter Traefik; TLS endet bei Traefik) --
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock # setup ohne Socket-Proxy
    # Zugriff auf Docker via Socket-Proxy statt direkt
    #command: -H tcp://socket-proxy:2375
    command: -H unix:///var/run/docker.sock
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy" 
      traefik.http.routers.portainer.rule: Host(`portainer.bause.lan`)
      traefik.http.routers.portainer.entrypoints: websecure
      traefik.http.routers.portainer.tls: "true"
      traefik.http.services.portainer.loadbalancer.server.port: "9000"

  # -- Pi-hole (DNS-Ports bleiben offen, UI über Traefik) --
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: always
    environment:
      TZ: ${TZ}
      FTLCONF_LOCAL_IPV4: 192.168.178.5
    volumes:
      - /srv/pi-docker/pihole/etc-pihole:/etc/pihole
    networks: [app-nw, proxy]
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # DHCP ggf.:
      # - "67:67/udp"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy" 
      traefik.http.routers.pihole.rule: Host(`pihole.bause.lan`)
      traefik.http.routers.pihole.entrypoints: websecure
      traefik.http.routers.pihole.tls: "true"
      traefik.http.services.pihole.loadbalancer.server.port: "80"
      # Optional: feste Prefix-Weiterleitung auf /admin
      traefik.http.middlewares.pihole-admin.redirectregex.regex: "^https?://([^/]+)/?$$"
      traefik.http.middlewares.pihole-admin.redirectregex.replacement: "https://$${1}/admin"
      traefik.http.middlewares.pihole-admin.redirectregex.permanent: "true"
      traefik.http.routers.pihole.middlewares: pihole-admin

  # -- WireGuard (nicht über Traefik) --
  cloudflare-ddns:
    container_name: dyndns
    image: favonia/cloudflare-ddns:latest
    network_mode: host
    restart: always
    user: "1000:1000"
    read_only: true
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
      - DOMAINS=${DOMAINS}
      - PROXIED=${PROXIED}
      - UPDATE_CRON=${UPDATE_CRON}

  # -- Code-Server (HTTPS intern -> sag Traefik "scheme=https") --
  # code-server:
  #   image: lscr.io/linuxserver/code-server:latest
  #   container_name: code-server
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=${TZ}
  #     - PASSWORD=${PASSWORD}
  #     - SUDO_PASSWORD=${SUDO_PASSWORD}
  #     - DEFAULT_WORKSPACE=${DEFAULT_WORKSPACE}
  #   volumes:
  #     - ./code-server:/config
  #   restart: unless-stopped
  #   networks: [proxy]
  #   labels:
  #     traefik.enable: "true"
  #     traefik.docker.network: "proxy" 
  #     traefik.http.routers.code.rule: Host(`code.bause.lan`)
  #     traefik.http.routers.code.entrypoints: websecure
  #     traefik.http.routers.code.tls: "true"
  #     traefik.http.services.code.loadbalancer.server.port: "8443"
  #     traefik.http.services.code.loadbalancer.server.scheme: "https"

  # -- Home Assistant (network_mode: host für mDNS und Zigbee) --
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=${TZ}
    volumes:
      - /srv/pi-docker/home-assistant/config:/config
      - ./home-assistant/configuration.yaml:/config/configuration.yaml
      - ./home-assistant/automations.yaml:/config/automations.yaml
      - ./home-assistant/scripts.yaml:/config/scripts.yaml
      - ./home-assistant/scenes.yaml:/config/scenes.yaml
      - ./home-assistant/blueprints:/config/blueprints
      - ./home-assistant/custom_components:/config/custom_components
      - ./home-assistant/themes:/config/themes
      - ./home-assistant/ui_lovelace_minimalist:/config/ui_lovelace_minimalist
      - /etc/pi-docker/secrets/home-assistant/secrets.yaml:/config/secrets.yaml:ro
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    # devices:
    #   - /dev/serial/by-id/usb-<DEIN_DONGLE>:/dev/ttyUSB0

   # --- MQTT Broker ---
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':075B ' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [iot]
    volumes:
      - mosquitto_data:/mosquitto/data
      - ./mosquitto/config:/mosquitto/config
      - /etc/pi-docker/secrets/mosquitto.passwords:/mosquitto/config/passwords:ro
      - ./mosquitto/log:/mosquitto/log
    # HA läuft im host network → Port 1883 am Host veröffentlichen
    ports:
      - "1883:1883"

  # --- Zigbee2MQTT ---
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http=require('http');const req=http.get('http://127.0.0.1:8080/',res=>process.exit(res.statusCode<500?0:1));req.on('error',()=>process.exit(1));req.setTimeout(3000,()=>{req.destroy();process.exit(1)});"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [iot, proxy]
    volumes:
      - /srv/pi-docker/zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    # Wenn du USB-Dongle nutzt, devices freigeben (by-id verwenden!):
    # devices:
    #   - /dev/serial/by-id/usb-<DEIN_DONGLE>:/dev/ttyUSB0
    environment:
      TZ: ${TZ}
      ZIGBEE2MQTT_CONFIG_MQTT_USER: ${MQTT_USER}
      ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: ${MQTT_PASSWORD}
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.z2m.rule: Host(`zigbee.bause.lan`)
      traefik.http.routers.z2m.entrypoints: websecure
      traefik.http.routers.z2m.tls: "true"
      traefik.http.services.z2m.loadbalancer.server.port: "8080" # Z2M-Frontend (intern)
  
  govee2mqtt:
    image: ghcr.io/wez/govee2mqtt:latest
    container_name: govee2mqtt
    restart: unless-stopped
    network_mode: host
    environment:
      # Govee Account / API
      GOVEE_API_KEY: "${GOVEE_API_KEY}"
      GOVEE_EMAIL: "${GOVEE_EMAIL}"        # optional, nur nötig für IoT/Tap-to-Run
      GOVEE_PASSWORD: "${GOVEE_PASSWORD}"     # optional

      # MQTT (geht über den Host-Port auf deinen mosquitto-Container)
      GOVEE_MQTT_HOST: "127.0.0.1"
      GOVEE_MQTT_PORT: "1883"
      GOVEE_MQTT_USER: "${MQTT_USER}"
      GOVEE_MQTT_PASSWORD: "${MQTT_PASSWORD}"

      # Sonstiges
      GOVEE_TEMPERATURE_SCALE: "C"
      TZ: "${TZ}"
  
    # -- Matter Server für Home Assistant (Python-Matter-Server) --
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5580/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    network_mode: host
    security_opt:
      - apparmor=unconfined
    volumes:
      - /srv/pi-docker/matter-server/data:/data
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=${TZ}
