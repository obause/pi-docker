- id: '1764365093872'
  alias: 'Sicherheit: Statusbericht beim Verlassen (Ole & Vanessa)'
  description: Sendet Statusbericht an Ole oder Vanessa, wenn sie das Haus verlassen.
  triggers:
  - entity_id: person.ole
    from: home
    trigger: state
  - entity_id: person.vanessa
    from: home
    trigger: state
  conditions: []
  actions:
  - variables:
      notification_target: "{% if trigger.entity_id == 'person.ole' %}\n  notify.mobile_app_ole_s24_ultra\n{%
        elif trigger.entity_id == 'person.vanessa' %}\n  notify.mobile_app_vanessas_iphone\n{%
        else %}\n  notify.notify\n{% endif %}\n"
      open_items: "{% set open = states.binary_sensor \n   | selectattr('state', 'eq',
        'on') \n   | selectattr('attributes.device_class', 'defined') \n   | selectattr('attributes.device_class',
        'in', ['window', 'door', 'garage_door']) \n   | map(attribute='name') \n   |
        list %}\n{{ open }}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ open_items | count > 0 }}'
      sequence:
      - action: '{{ notification_target }}'
        data:
          title: ⚠️ Warte! Es ist noch was offen
          message: 'Du hast das Haus verlassen, aber folgende Dinge sind noch offen:

            {{ open_items | join('', '') }}

            '
          data:
            push:
              sound:
                name: default
                critical: 1
    default:
    - action: '{{ notification_target }}'
      data:
        title: ✅ Alles sicher
        message: Du hast das Haus verlassen. Alle Fenster und Türen sind zu.
  mode: single
