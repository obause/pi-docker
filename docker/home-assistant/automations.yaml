- id: '1763976627784'
  alias: Waschmaschine Automation
  description: ''
  use_blueprint:
    path: Blackshome/appliance-notifications.yaml
    input:
      power_sensor: sensor.plug_03_power
      running_dead_zone: 5
      start_appliance_power: 15
      end_time_delay: 3
      include_start_notify: enable_start_notify_options
      start_notify_device:
      - 16b44fb78b0b8d82a868b5f1411ee2d1
      - 498277a3da3d515e78bfd5af48a8ae42
      start_title: Waschmaschine
      start_message: Waschmaschine wurde gestartet
      include_end_notify: enable_end_notify_options
      end_notify_device:
      - 16b44fb78b0b8d82a868b5f1411ee2d1
      - 498277a3da3d515e78bfd5af48a8ae42
      end_message_title: Waschmaschine
      end_message: Waschmaschine ist fertig!
      include_run_status: run_status_enabled
      run_status_entity: input_select.waschmaschine_status
      run_status_start: Waschmaschine läuft
      run_status_end: Wäsche ist fertig!
      run_status_end_reminder: Waschmaschine noch nicht geleert!
      run_status_end_attended: Waschmaschine bereit
      include_power_tracking: enable_power_tracking
      power_consumption_sensor: sensor.plug_03_energy
      start_power_consumption: input_number.waschmaschine_start
      end_power_consumption: input_number.waschmaschine_ende
      include_runtime_tracking: enable_runtime_tracking
      runtime_tracking_helper: input_text.waschmaschine_laufzeit
      runtime_tracking_end_message: Gesamtlaufzeit
      include_duration_tracking: enable_duration_tracking
      end_message_duration_tracking: Laufzeit
      include_cycle_counter: enable_cycle_counter
      cycle_counter_helper: counter.waschmaschine_zyklen
      cycle_counter_end_message: Gesamtzyklen
      include_service_reminder: enable_service_reminder
      service_reminder_counter_helper: counter.waschmaschine_service_zyklen
      service_reminder_end_message: ⚠️ Zeit einen Service für die Waschmaschine durchzuführen!
- id: '1764086374849'
  alias: Waschmaschine - Laufzeit-Timer steuern
  description: ''
  triggers:
  - entity_id:
    - input_select.waschmaschine_status
    to:
    - Waschmaschine läuft
    id: start
    trigger: state
  - entity_id:
    - input_select.waschmaschine_status
    to:
    - Wäsche ist fertig!
    - Waschmaschine bereit
    id: stop
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - target:
          entity_id: timer.waschmaschine_laufzeit
        action: timer.start
    - conditions:
      - condition: trigger
        id: stop
      sequence:
      - target:
          entity_id: timer.waschmaschine_laufzeit
        action: timer.cancel
  mode: single
