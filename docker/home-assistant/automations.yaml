    - sensor.geschirrspuler_programm_abgebrochen
    to:
    - present
    - confirmed
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.geschirrspuler_betriebszustand
        state: finished
      sequence:
      - action: notify.notify
        metadata: {}
        data:
          title: ✅Geschirrspüler fertig
          message: ✅Programm fertig - Geschirr kann ausgeräumt werden
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.geschirrspuler_programm_abgebrochen'')
          in [''present'',''confirmed''] }}'
      sequence:
      - action: notify.notify
        metadata: {}
        data:
          title: ⛔Geschirrspüler abgebrochen
          message: ⛔Programm abgebrochen - Das Programm wurde abgebrochen
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.geschirrspuler_betriebszustand'') in [''error'',''actionrequired'']
          }}'
      sequence:
      - action: notify.notify
        metadata: {}
        data:
          title: ❗Geschirrspüler Fehler
          message: "{% if is_state('sensor.geschirrspuler_betriebszustand','error')
            %}\n  Fehler ❗ Bitte prüfen.\n{% else %}\n  Aktion erforderlich ❗ Bitte
            prüfen.\n{% endif %}"
  mode: single
- id: '1766942950836'
  alias: Geschirrspüler - Erinnerung Ausräumen nach 1h
  description: Wenn nach 1 Stunde noch fertig und Tür zu, Erinnerung senden
  triggers:
  - entity_id:
    - sensor.geschirrspuler_betriebszustand
    to:
    - finished
    trigger: state
  conditions: []
  actions:
  - delay: 01:00:00
  - condition: state
    entity_id: sensor.geschirrspuler_betriebszustand
    state: finished
  - condition: state
    entity_id: sensor.geschirrspuler_tur
    state: closed
  - action: notify.notify
    metadata: {}
    data:
      title: Geschirrspüler
      message: "Seit 1 Stunde fertig – Zeit zum Ausräumen \U0001F9FC"
  mode: restart
- id: '1766942995733'
  alias: Geschirrspüler - Start Benachrichtigung (Programm/Laufzeit/Ende)
  description: Sendet beim Start das Programm (DE), Restlaufzeit und geplantes Ende
  triggers:
  - entity_id:
    - sensor.geschirrspuler_betriebszustand
    to:
    - run
    trigger: state
  conditions: []
  actions:
  - delay: 00:00:10
  - variables:
      prog_raw: '{{ states(''select.geschirrspuler_aktives_programm'') }}'
      sel_raw: '{{ states(''select.geschirrspuler_ausgewahltes_programm'') }}'
      prog: "{% set m = {\n  'dishcare_dishwasher_program_quick_65':'Schnell 65°C',\n
        \ 'dishcare_dishwasher_program_eco_50':'Eco 50°C',\n  'dishcare_dishwasher_program_intensiv_70':'Intensiv
        70°C',\n  'dishcare_dishwasher_program_auto_2':'Auto',\n  'dishcare_dishwasher_program_night_wash':'Nacht',\n
        \ 'dishcare_dishwasher_program_machine_care':'Maschinenpflege',\n  'dishcare_dishwasher_program_pre_rinse':'Vorspülen'\n}
        %} {% set raw = prog_raw if prog_raw not in ['unknown','unavailable',''] else
        sel_raw %} {{ m.get(raw, raw) if raw not in ['unknown','unavailable',''] else
        '—' }}"
      end_ts: '{% set e = states(''sensor.geschirrspuler_programm_endzeit'') %} {{
        as_timestamp(e) if e not in [''unknown'',''unavailable'',''''] else none }}'
      laufzeit: "{% if end_ts %}\n  {% set mins = ((end_ts - as_timestamp(now()))
        / 60) | round(0, 'floor') | int %}\n  {% set mins = [mins, 0] | max %}\n  {%
        set h = (mins // 60) | int %}\n  {% set m = (mins % 60) | int %}\n  {% if
        h > 0 %}\n    {{ h }}h {{ '%02d' | format(m) }}m\n  {% else %}\n    {{ m }}m\n
        \ {% endif %}\n{% else %}\n  —\n{% endif %}"
      ende: "{% if end_ts %}\n  {{ timestamp_custom(end_ts, '%d.%m %H:%M', true) }}\n{%
        else %}\n  —\n{% endif %}"
  - action: notify.notify
    metadata: {}
    data:
      title: Geschirrspüler
      message: 'Gestartet ▶️ {{ prog }} · Laufzeit: {{ laufzeit }} · Ende: {{ ende
        }}'
  mode: single
- id: '1766943077827'
  alias: Geschirrspüler - Nach Spülgang prüfen (Klarspüler/Salz)
  description: Prüft nach finished, ob Klarspüler oder Salz nachgefüllt werden muss
  triggers:
  - entity_id:
    - sensor.geschirrspuler_betriebszustand
    to:
    - finished
    trigger: state
  conditions: []
  actions:
  - delay: 00:00:15
  - variables:
      rinse_state: '{{ states(''sensor.geschirrspuler_klarspuler_fast_leer'') }}'
      salt_state: '{{ states(''sensor.geschirrspuler_salz_fast_leer'') }}'
      need_rinse: '{{ rinse_state in [''present'',''confirmed''] }}'
      need_salt: '{{ salt_state in [''present'',''confirmed''] }}'
  - condition: template
    value_template: '{{ need_rinse or need_salt }}'
  - action: notify.notify
    metadata: {}
    data:
      title: Geschirrspüler
      message: "Folgendes ist fast leer und muss nachgefüllt werden: {%- set items
        = [] -%} {%- if need_rinse -%}{%- set _ = items.append('Klarspüler') -%}{%-
        endif -%} {%- if need_salt -%}{%- set _ = items.append('Salz') -%}{%- endif
        -%} {{ items | join(' & ') }} \U0001F9C2\U0001FAE7"
  mode: single
- id: '1766943202243'
  alias: Kühlschrank - Tür länger als 2 Minuten offen (Kühl + Gefrier)
  description: Benachrichtigt wenn Kühl- oder Gefrierschranktür 2 Minuten offen bleibt
  triggers:
  - entity_id:
    - sensor.kuhlschrank_kuhlschranktur
    to:
    - open
    - 'on'
    for: 00:02:00
    trigger: state
  - entity_id:
    - sensor.kuhlschrank_gefrierschranktur
    to:
    - open
    - 'on'
    for: 00:02:00
    trigger: state
  conditions: []
  actions:
  - variables:
      door_name: "{% if trigger.entity_id == 'sensor.kuhlschrank_kuhlschranktur' %}\n
        \ Kühlschrank\n{% else %}\n  Gefrierschrank\n{% endif %}"
  - action: notify.notify
    metadata: {}
    data:
      title: Kühlschrank - Tür offen!
      message: "{{ door_name }}-Tür ist seit über 2 Minuten offen \U0001F6AA❗ Bitte
        schließen."
  mode: single
- id: '1768691110895'
  alias: Wohnzimmer Rollo - Sonnenuntergang runter, Sonnenaufgang hoch
  description: Fährt das Wohnzimmer-Rollo abends automatisch runter und morgens wieder
    hoch.
  triggers:
  - event: sunset
    offset: 00:10:00
    id: sunset_down
    trigger: sun
  - event: sunrise
    offset: 00:10:00
    id: sunrise_up
    trigger: sun
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sunset_down
      sequence:
      - target:
          entity_id:
          - cover.shutter_02
        action: cover.close_cover
        data: {}
    - conditions:
      - condition: trigger
        id: sunrise_up
      sequence:
      - target:
          entity_id:
          - cover.shutter_02
          - cover.shutter_01
        action: cover.open_cover
        data: {}
  mode: single
- id: '1768691569546'
  alias: Wohnzimmer Licht - Anwesenheit nach Sonnenuntergang
  description: Schaltet Wohnzimmer-Lichter bei Anwesenheit nach Sonnenuntergang ein
    (nur wenn aus) und nach 10 Min Abwesenheit aus.
  triggers:
  - entity_id: binary_sensor.wohnzimmer_anwesenheit
    to: 'on'
    id: presence_on
    trigger: state
  - entity_id: binary_sensor.wohnzimmer_anwesenheit
    to: 'off'
    for: 00:10:00
    id: presence_off_10m
    trigger: state
  conditions:
  - condition: sun
    after: sunset
    before: sunrise
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: presence_on
      - condition: state
        entity_id: group.wohnzimmer_lampen
        state: 'off'
      sequence:
      - target:
          entity_id:
          - light.wohnzimmer_stehlampe
          - light.stehlampe_wohnzimmer_2
        action: light.turn_on
        data:
          brightness_pct: 25
    - conditions:
      - condition: trigger
        id: presence_off_10m
      sequence:
      - target:
          entity_id:
          - light.wohnzimmer_deckenlampe
          - light.wohnzimmer_stehlampe
          - light.wohnzimmer_led_strip
        action: light.turn_off
  mode: restart
