- id: '1764234782669'
  alias: 'Sicherheitscheck: 22 Uhr Fenster/Türen prüfen'
  description: Prüft jeden Abend um 22:00 Uhr, ob Fenster oder Türen noch offen sind
    und meldet welche.
  triggers:
  - at: '22:00:00'
    trigger: time
  conditions:
  - condition: template
    value_template: "{{ states.binary_sensor \n   | selectattr('state', 'eq', 'on')
      \n   | selectattr('attributes.device_class', 'defined') \n   | selectattr('attributes.device_class',
      'in', ['window', 'door', 'garage_door']) \n   | list | count > 0 }}\n"
  actions:
  - action: notify.notify
    data:
      title: ⚠️ Fenster/Türen noch offen!
      message: "Es ist 22 Uhr und folgende Fenster/Türen sind noch nicht geschlossen:
        \ {{ states.binary_sensor \n   | selectattr('state', 'eq', 'on') \n   | selectattr('attributes.device_class',
        'defined') \n   | selectattr('attributes.device_class', 'in', ['window', 'door',
        'garage_door']) \n   | map(attribute='name') \n   | list \n   | join(', ')
        }}\n"
- id: '1764235251377'
  alias: 'Sicherheit: Statusbericht (Personalisiert)'
  description: Sendet Statusbericht nur an die Person, die das Haus verlässt.
  triggers:
  - entity_id: person.ihr_name
    from: home
    trigger: state
  - entity_id: person.name_freundin
    from: home
    trigger: state
  conditions: []
  actions:
  - variables:
      notification_target: "{% if trigger.entity_id == 'person.ihr_name' %}\n  notify.ihr_persoenlicher_notify_dienst\n{%
        elif trigger.entity_id == 'person.name_freundin' %}\n  notify.persoenlicher_notify_dienst_freundin\n{%
        else %}\n  notify.notify # Fallback, falls der Trigger unerwartet ist\n{%
        endif %}\n"
      open_items: "{% set open = states.binary_sensor \n   | selectattr('state', 'eq',
        'on') \n   | selectattr('attributes.device_class', 'defined') \n   | selectattr('attributes.device_class',
        'in', ['window', 'door', 'garage_door']) \n   | map(attribute='name') \n   |
        list %}\n{{ open }}\n"
  - choose:
    - conditions: '{{ open_items | count > 0 }}'
      sequence:
      - data:
          title: '⚠️ Achtung: Fenster/Türen offen!'
          message: 'Sie haben das Haus verlassen, aber folgende Dinge sind noch offen:

            {{ open_items | join('', '') }}

            '
        action: '{{ notification_target }}'
    default:
    - data:
        title: ✅ Alles sicher
        message: Sie haben das Haus verlassen. Alle Fenster und Türen sind geschlossen.
      action: '{{ notification_target }}'
